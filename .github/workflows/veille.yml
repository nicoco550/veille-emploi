name: Veille emploi

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 cloudscraper

      - name: Collecte
        run: python veille_ats.py collect

      - name: Publier les nouvelles offres
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add offres.json deja_vues.json
          git diff --staged --quiet || git commit -m "offres $(date -u '+%Y-%m-%d %H:%M')"
          git push
